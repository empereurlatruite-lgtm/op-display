[workspace]
resolver = "2"
members = ["opengine-core", "op-engine", "opengine-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/empereurlatruite-lgtm/op-display"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, panic-free wasm for the browser wargame build.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
